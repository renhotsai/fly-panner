[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-panner"
version = "0.1.0"
description = "Find the cheapest flights within a departure and return date range"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["flights", "travel", "price", "cheap", "amadeus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Utilities",
]
dependencies = [
    "amadeus>=9.0.0",
    "click>=8.0",
    "rich>=13.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "responses>=0.23",
]

[project.scripts]
fly-panner = "fly_panner.cli:main"

[project.urls]
Homepage = "https://github.com/renhotsai/fly-panner"
Issues = "https://github.com/renhotsai/fly-panner/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["fly_panner*"]
